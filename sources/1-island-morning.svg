      <rect x="-7" y="0" width="14" height="52" fill="#FFF6E3"/>
      <ellipse cx="-14" cy="-4" rx="13" ry="9" fill="none" stroke="#FFF6E3" stroke-width="6"/>
      <ellipse cx="14" cy="-4" rx="13" ry="9" fill="none" stroke="#FFF6E3" stroke-width="6"/>
    </g>
  </g>

  <!-- sea -->
  <rect y="830" width="2560" height="610" fill="url(#sea)"/>
  <rect y="830" width="2560" height="6" fill="#FFFFFF" opacity="0.55"/>

  <!-- waves -->
  <g stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M330 930 q 34 -16 68 0"/>
    <path d="M900 980 q 40 -18 80 0"/>
    <path d="M1750 940 q 34 -16 68 0"/>
    <path d="M2200 1010 q 40 -18 80 0"/>
    <path d="M520 1120 q 44 -20 88 0"/>
    <path d="M1240 1150 q 44 -20 88 0"/>
    <path d="M1980 1160 q 40 -18 80 0"/>
    <path d="M2380 1240 q 44 -20 88 0"/>
    <path d="M760 1310 q 48 -22 96 0"/>
    <path d="M1600 1330 q 44 -20 88 0"/>
    <path d="M2120 1380 q 48 -22 96 0"/>
  </g>

  <!-- far island -->
  <ellipse cx="2020" cy="840" rx="190" ry="26" fill="#7FBF86"/>
  <g transform="translate(2020,826) scale(0.42)">
    <path d="M-7 0 C -16 -78 -8 -158 7 -232 L 27 -227 C 14 -156 9 -78 13 0 Z" fill="#9A6B44"/>
    <g transform="translate(10,-232)" fill="#4E9F3D">
      <path d="M0 0 C 42 -36 104 -40 152 -14 C 106 -4 54 10 6 12 Z" transform="rotate(-140)"/>
      <path d="M0 0 C 42 -36 104 -40 152 -14 C 106 -4 54 10 6 12 Z" transform="rotate(-80)"/>
      <path d="M0 0 C 42 -36 104 -40 152 -14 C 106 -4 54 10 6 12 Z" transform="rotate(-20)"/>
      <path d="M0 0 C 42 -36 104 -40 152 -14 C 106 -4 54 10 6 12 Z" transform="rotate(40)"/>
      <path d="M0 0 C 42 -36 104 -40 152 -14 C 106 -4 54 10 6 12 Z" transform="rotate(100)"/>
    </g>
  </g>

  <!-- sailboat -->
  <g transform="translate(1950,1115)">
    <path d="M-70 0 L70 0 L46 34 L-48 34 Z" fill="#8A5A38"/>
    <path d="M0 -6 L0 -118" stroke="#5E4630" stroke-width="7"/>
    <path d="M4 -118 L4 -18 L88 -18 Z" fill="#FFF6E3"/>
    <path d="M-4 -100 L-4 -18 L-58 -18 Z" fill="#F2DEB4"/>
  </g>

  <!-- main island -->
  <path d="M-60 1440 L-60 1010 C 260 918 560 936 820 992 C 1060 1042 1320 1024 1490 1090 C 1552 1118 1588 1210 1592 1320 L1592 1440 Z" fill="#F2E0AE"/>
  <path d="M-60 1440 L-60 946 C 270 846 570 866 830 926 C 1070 980 1320 962 1490 1030 C 1550 1058 1580 1150 1584 1260 L1584 1440 Z" fill="#96D076"/>
  <path d="M-60 1440 L-60 972 C 270 872 570 892 830 952 C 1070 1006 1320 988 1490 1056 C 1548 1084 1574 1170 1578 1276 L1578 1440 Z" fill="#7EBE5C"/>
  <path d="M-60 1440 L-60 1330 C 420 1284 940 1296 1520 1340 C 1556 1352 1578 1384 1578 1440 Z" fill="#63AC49"/>

  <!-- palms -->
  <use xlink:href="#palm" transform="translate(340,935) scale(1.18)"/>
  <use xlink:href="#palm" transform="translate(590,958) scale(0.92)"/>

  <!-- flowers & grass tufts -->
  <use xlink:href="#flower" transform="translate(230,1030) scale(1.1)" fill="#FFFFFF"/>
  <use xlink:href="#flower" transform="translate(700,1005)" fill="#F6B8C1"/>
  <use xlink:href="#flower" transform="translate(1010,1075) scale(1.15)" fill="#FFFFFF"/>
  <use xlink:href="#flower" transform="translate(1310,1040) scale(0.9)" fill="#F6B8C1"/>
  <g fill="#4E8F3A">
    <path d="M420 1042 q -8 -26 2 -44 q 6 22 10 44 Z"/>
    <path d="M436 1042 q 4 -24 16 -36 q -2 20 -4 36 Z"/>
    <path d="M1150 1088 q -8 -26 2 -44 q 6 22 10 44 Z"/>
    <path d="M1166 1088 q 4 -24 16 -36 q -2 20 -4 36 Z"/>
  </g>

  <!-- islet bottom right -->
  <path d="M2120 1440 L2120 1400 C 2160 1330 2300 1296 2440 1310 C 2500 1318 2540 1340 2560 1364 L2560 1440 Z" fill="#F2E0AE"/>
  <path d="M2150 1440 L2150 1396 C 2190 1330 2310 1300 2440 1312 C 2500 1320 2540 1342 2560 1366 L2560 1440 Z" fill="#7EBE5C"/>
  <use xlink:href="#flower" transform="translate(2380,1352) scale(0.9)" fill="#FFFFFF"/>
</svg>
