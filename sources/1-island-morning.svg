<svg width="2560" height="1440" viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#AFE6F4"/>
      <stop offset="0.55" stop-color="#D6F2F8"/>
      <stop offset="1" stop-color="#EFFAF0"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ED4E0"/>
      <stop offset="1" stop-color="#57AFc6"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF2BE" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFF2BE" stop-opacity="0"/>
    </radialGradient>
    <g id="cloud">
