    <path d="M900 250 q 13 -11 26 0 q 13 -11 26 0"/>
    <path d="M1330 340 q 14 -12 28 0 q 14 -12 28 0"/>
  </g>

  <!-- balloon present -->
  <g>
    <path d="M1902 505 Q 1888 548 1902 578" stroke="#B0564B" stroke-width="4" fill="none"/>
    <circle cx="1902" cy="452" r="56" fill="#E86A5E"/>
    <ellipse cx="1884" cy="432" rx="16" ry="10" fill="#FFFFFF" opacity="0.45" transform="rotate(-24 1884 432)"/>
    <path d="M1894 505 L1910 505 L1902 516 Z" fill="#C25448"/>
    <g transform="translate(1902,586)">
